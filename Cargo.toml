[workspace]
members = [".", "web"]
# The web crate only builds for wasm32-unknown-unknown (it imports its file reader from JavaScript), so plain
# `cargo build` / `cargo test` cover the emulator crate and the native binaries.
default-members = ["."]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/OWNER/w53ga-emulator"
rust-version = "1.82"

[package]
name = "w53ga-emu"
description = "Hardware emulator for the AR-W53GA car GPS/radar unit: Renesas SH7269 (SH-2A) main CPU, RL78/G13 controller and board peripherals"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["emulator", "sh2a", "rl78", "renesas", "wasm"]
categories = ["emulators"]
build = "build.rs"

[lib]
name = "w53ga_emu"
path = "src/lib.rs"

[[bin]]
name = "w53ga"
path = "src/bin/w53ga.rs"

[[bin]]
name = "w53ga-headless"
path = "src/bin/w53ga-headless.rs"

[[bin]]
name = "w53ga-serve"
path = "src/bin/w53ga-serve.rs"

[[bin]]
name = "rl78-run"
path = "src/bin/rl78-run.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
serde-big-array = "0.5"
flate2 = "1"
base64 = "0.22"
jpeg-decoder = "0.3"
sha2 = "0.10"

# Desktop front end only (window, audio); the emulator library builds for wasm32 without them.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
minifb = "0.27"
cpal = "0.15"

[profile.release]
opt-level = 3
debug = "line-tables-only"
lto = "thin"
codegen-units = 1

# The browser build: cargo build -p w53ga-web --target wasm32-unknown-unknown --profile wasm-release
[profile.wasm-release]
inherits = "release"
debug = false
lto = true
panic = "abort"

# The emulator is far too slow unoptimised to boot anything; tests still build quickly at opt-level 1.
[profile.dev]
opt-level = 1
