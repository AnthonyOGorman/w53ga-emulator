[package]
name = "w53ga-web"
description = "WebAssembly front end of the AR-W53GA emulator (the same emulator crate, driven from a browser worker)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
w53ga-emu = { path = ".." }
serde_json = "1"
